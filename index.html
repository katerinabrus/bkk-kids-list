<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Family Places</title>

  <!-- Tailwind CDN (fine for a small private GitHub Pages site) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PapaParse for CSV parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

  <style>
    .card-shadow { box-shadow: 0 10px 25px rgba(0,0,0,0.06); }
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="max-w-6xl mx-auto px-4 py-6">
    <header class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <h1 class="text-2xl font-extrabold tracking-tight">Places to go</h1>
        <p class="text-sm text-slate-500">Family list powered by Google Sheets</p>
      </div>

    <div class="flex flex-col sm:flex-row sm:items-center gap-3">
  <nav class="flex gap-2 text-sm font-bold">
    <a href="./index.html" class="px-3 py-2 rounded-xl bg-slate-900 text-white hover:bg-slate-800">
      Bangkok
    </a>
    <a href="./huahin.html" class="px-3 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50">
      Hua Hin
    </a>
  </nav>

  <div class="flex items-center gap-3">
    <button id="reload-btn" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-bold hover:bg-slate-800">
      Reload
    </button>
    <span class="text-sm text-slate-500">
      Results: <span id="res-count" class="font-bold text-slate-700">0</span>
    </span>
  </div>
</div>


    </header>

    <!-- Controls -->
    <section class="mt-5 grid grid-cols-1 sm:grid-cols-3 gap-3">
      <input
        id="search-box"
        type="text"
        placeholder="Search name or notes..."
        class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200"
      />

      <select
        id="filter-area"
        class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200"
      >
        <option value="">All Areas</option>
      </select>

      <select
        id="filter-cat"
        class="w-full px-4 py-3 rounded-2xl border border-slate-200 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-200"
      >
        <option value="">All Categories</option>
      </select>
    </section>

    <!-- Status -->
    <section class="mt-4">
      <div id="status" class="text-sm text-slate-500"></div>
      <div id="error" class="hidden mt-2 p-3 rounded-xl bg-rose-50 text-rose-700 text-sm"></div>
    </section>

    <!-- Grid -->
    <section class="mt-6">
      <div id="grid-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </section>
  </div>

  <!-- Modal -->
  <div id="detail-modal" class="hidden fixed inset-0 z-50">
    <div class="absolute inset-0 bg-black/50" id="modal-backdrop"></div>

    <div class="relative max-w-2xl mx-auto mt-10 sm:mt-16 px-4">
      <div class="bg-white rounded-2xl card-shadow overflow-hidden">
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
          <div class="text-sm font-bold text-slate-700">Details</div>
          <button id="modal-close" class="text-slate-500 hover:text-slate-800 text-sm font-bold">
            Close
          </button>
        </div>

        <div id="modal-content" class="p-5"></div>
      </div>
    </div>
  </div>

  <script>
    /*****************************************************************
     * CONFIG (YOUR LINKS)
     *****************************************************************/
    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/e/2PACX-1vSEVt0blGkEQLp_nZ8btg-CV0poZtwebf3k1hOPSZ5-fel15vMNQzd5mHQ48WnFixu-KCcDi1TsNZ5u/pub?gid=0&single=true&output=csv";

    // Pre-filled Google Form link you provided
    const FORM_PREFILL_TEMPLATE =
      "https://docs.google.com/forms/d/e/1FAIpQLSftVhVHiEU1-fp7wMQj9AkR2vuRoLCz6gWOQNVJj14XwFcssw/viewform?usp=pp_url&entry.1418308748=1&entry.435347963=test";

    // Expected column headers in your Google Sheet (Row 1)
    const COLS = {
      id: "id",
      name: "name",
      category: "category",
      area: "area",
      desc: "desc",
      maps: "maps",
      instagram: "instagram" // ✅ added
    };

    /*****************************************************************
     * STATE
     *****************************************************************/
    let venues = [];
    let lastFiltered = [];

    /*****************************************************************
     * UTILITIES
     *****************************************************************/
    const norm = (x) => (x ?? "").toString().trim();

    // Escape to prevent accidental HTML injection from sheet content
    const esc = (s) => norm(s).replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[ch]));

    const slugify = (s) =>
      norm(s)
        .toLowerCase()
        .replace(/\s+/g, "-")
        .replace(/[^a-z0-9-]/g, "")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "");

    const isHttpUrl = (s) => /^https?:\/\//i.test(norm(s));

    // Turn "@handle" or "handle" into https://instagram.com/handle
    function instagramUrl(handle) {
      const h = norm(handle).replace(/^@/, "");
      if (!h) return "";
      // treat "N/A" as empty
      if (h.toLowerCase() === "n/a") return "";
      return `https://instagram.com/${encodeURIComponent(h)}`;
    }

    function cleanIgHandle(handle) {
      const h = norm(handle).replace(/^@/, "");
      if (!h) return "";
      if (h.toLowerCase() === "n/a") return "";
      return h;
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg || "";
    }

    function showError(msg) {
      const el = document.getElementById("error");
      el.textContent = msg;
      el.classList.remove("hidden");
    }

    function clearError() {
      const el = document.getElementById("error");
      el.textContent = "";
      el.classList.add("hidden");
    }

    /*****************************************************************
     * GOOGLE FORM PREFILL LINK BUILDER
     * Template placeholders:
     *   entry.1418308748 = 1    (venue id placeholder)
     *   entry.435347963  = test (venue name placeholder)
     *****************************************************************/
    function buildSuggestEditLink(v) {
      const url = new URL(FORM_PREFILL_TEMPLATE);

      for (const [k, val] of url.searchParams.entries()) {
        if (!k.startsWith("entry.")) continue;
        if (val === "1") url.searchParams.set(k, String(v.id));
        if (val === "test") url.searchParams.set(k, v.name);
      }

      return url.toString();
    }

    /*****************************************************************
     * NORMALIZATION
     *****************************************************************/
    function normalizeVenue(row) {
      const id = norm(row[COLS.id]);
      const name = norm(row[COLS.name]);
      const category = norm(row[COLS.category]);
      const area = norm(row[COLS.area]);
      const desc = norm(row[COLS.desc]);
      const maps = norm(row[COLS.maps]);
      const instagram = norm(row[COLS.instagram]); // ✅ added

      const fallbackId =
        name
          ? slugify(name)
          : (crypto?.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2));

      const v = {
        id: id || fallbackId,
        name,
        category,
        area,
        desc,
        maps,
        instagram // ✅ added
      };

      v.searchText = (v.name + " " + v.desc + " " + cleanIgHandle(v.instagram)).toLowerCase();

      return v;
    }

    function enforceUniqueIds(list) {
      const seen = new Set();
      const dupes = new Set();
      for (const v of list) {
        if (seen.has(v.id)) dupes.add(v.id);
        seen.add(v.id);
      }
      return Array.from(dupes);
    }

    /*****************************************************************
     * DATA LOADING
     *****************************************************************/
    function loadData() {
      clearError();
      setStatus("Loading venues from Google Sheet...");

      Papa.parse(SHEET_URL, {
        download: true,
        header: true,
        skipEmptyLines: "greedy",
        complete: function(results) {
          try {
            const rawRows = Array.isArray(results.data) ? results.data : [];
            venues = rawRows
              .map(normalizeVenue)
              .filter(v => v.name);

            const dupes = enforceUniqueIds(venues);
            if (dupes.length) {
              console.warn("Duplicate venue IDs in sheet:", dupes);
              setStatus(`Loaded ${venues.length} venues (warning: duplicate IDs found).`);
            } else {
              setStatus(`Loaded ${venues.length} venues.`);
            }

            initApp();
          } catch (e) {
            console.error(e);
            showError("Loaded the sheet, but failed to process it. Check your headers and data.");
            setStatus("");
          }
        },
        error: function(err) {
          console.error("Error loading Google Sheet:", err);
          showError("Could not load the venue list. Check the published CSV link and that it's publicly accessible.");
          setStatus("");
        }
      });
    }

    /*****************************************************************
     * UI INIT + EVENTS
     *****************************************************************/
    function initApp() {
      populateFilters();
      applyFilters();
    }

    let searchTimer = null;

    function hookEvents() {
      const searchEl = document.getElementById("search-box");
      const areaEl = document.getElementById("filter-area");
      const catEl = document.getElementById("filter-cat");

      searchEl.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
      });

      areaEl.addEventListener("change", applyFilters);
      catEl.addEventListener("change", applyFilters);

      document.getElementById("reload-btn").addEventListener("click", loadData);

      document.getElementById("grid-container").addEventListener("click", (e) => {
        const card = e.target.closest(".venue-card");
        if (!card) return;
        openModal(card.dataset.id);
      });

      document.getElementById("modal-close").addEventListener("click", closeModal);
      document.getElementById("modal-backdrop").addEventListener("click", closeModal);

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });
    }

    /*****************************************************************
     * FILTERS
     *****************************************************************/
    function populateFilters() {
      const areaSelect = document.getElementById("filter-area");
      const catSelect = document.getElementById("filter-cat");

      const areas = [...new Set(venues.map(v => v.area).filter(Boolean))].sort((a, b) => a.localeCompare(b));
      const cats  = [...new Set(venues.map(v => v.category).filter(Boolean))].sort((a, b) => a.localeCompare(b));

      areaSelect.innerHTML =
        '<option value="">All Areas</option>' +
        areas.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");

      catSelect.innerHTML =
        '<option value="">All Categories</option>' +
        cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
    }

    function applyFilters() {
      const search = norm(document.getElementById("search-box").value).toLowerCase();
      const area = norm(document.getElementById("filter-area").value);
      const cat  = norm(document.getElementById("filter-cat").value);

      lastFiltered = venues.filter(v => {
        const matchesSearch = !search || v.searchText.includes(search);
        const matchesArea = !area || v.area === area;
        const matchesCat  = !cat  || v.category === cat;
        return matchesSearch && matchesArea && matchesCat;
      });

      renderGrid(lastFiltered);
    }

    /*****************************************************************
     * RENDER GRID (tiles now show Instagram handle if present)
     *****************************************************************/
    function renderGrid(data) {
      const container = document.getElementById("grid-container");

      container.innerHTML = data.map(v => {
        const ig = cleanIgHandle(v.instagram);
        return `
          <div
            class="venue-card bg-white p-5 rounded-2xl card-shadow flex flex-col justify-between cursor-pointer hover:translate-y-[-1px] transition"
            data-id="${esc(v.id)}"
          >
            <div>
              <div class="flex justify-between items-start mb-3">
                <span class="px-2 py-1 bg-indigo-50 text-indigo-600 text-[10px] font-bold rounded-md uppercase">
                  ${esc(v.category || "uncategorized")}
                </span>
                <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                  ${esc(v.area || "")}
                </span>
              </div>

              <h3 class="font-bold text-slate-900 mb-2 leading-tight">${esc(v.name)}</h3>
              <p class="text-xs text-slate-500 line-clamp-2">${esc(v.desc)}</p>

              ${ig ? `
                <div class="mt-2 text-[11px] text-slate-400 font-medium">
                  @${esc(ig)}
                </div>
              ` : ""}
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("res-count").innerText = String(data.length);
    }

    /*****************************************************************
     * MODAL (adds clickable Instagram link)
     *****************************************************************/
    function openModal(id) {
      const v = venues.find(item => String(item.id) === String(id));
      if (!v) return;

      const mapsLink = isHttpUrl(v.maps) ? norm(v.maps) : "";
      const suggestUrl = buildSuggestEditLink(v);

      const igHandle = cleanIgHandle(v.instagram);
      const igLink = igHandle ? instagramUrl(igHandle) : "";

      document.getElementById("modal-content").innerHTML = `
        <div class="space-y-6">
          <div>
            <span class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest">${esc(v.category || "")}</span>
            <h2 class="text-2xl sm:text-3xl font-bold text-slate-900 mt-1">${esc(v.name)}</h2>
            <p class="text-slate-400 text-sm font-medium mt-1">${esc(v.area || "")}</p>
          </div>

          <div class="space-y-2">
            <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Notes</h4>
            <p class="text-sm text-slate-600 leading-relaxed">${esc(v.desc)}</p>
          </div>

          ${igLink ? `
            <div class="space-y-1">
              <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Instagram</h4>
              <a href="${igLink}" target="_blank" rel="noopener"
                 class="text-sm font-medium text-indigo-600 hover:underline">
                @${esc(igHandle)}
              </a>
            </div>
          ` : ""}

          <div class="flex flex-col sm:flex-row gap-3">
            ${
              mapsLink
                ? `<a href="${mapsLink}" target="_blank" rel="noopener" class="flex-1 py-3 bg-slate-100 text-center rounded-xl text-xs font-bold hover:bg-slate-200">Open Maps</a>`
                : `<button disabled class="flex-1 py-3 bg-slate-100 text-center rounded-xl text-xs font-bold opacity-50 cursor-not-allowed">No Maps link</button>`
            }

            <a href="${suggestUrl}" target="_blank" rel="noopener" class="flex-1 py-3 border border-indigo-200 text-indigo-600 text-center rounded-xl text-xs font-bold hover:bg-indigo-50">
              Suggest Edit
            </a>
          </div>

          <div class="text-[11px] text-slate-400">
            Venue ID: <span class="font-mono text-slate-500">${esc(v.id)}</span>
          </div>
        </div>
      `;

      document.getElementById("detail-modal").classList.remove("hidden");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("detail-modal").classList.add("hidden");
      document.body.style.overflow = "auto";
    }

    /*****************************************************************
     * BOOT
     *****************************************************************/
    hookEvents();
    loadData();
  </script>
</body>
</html>
