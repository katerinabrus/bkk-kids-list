        // --- APPLICATION LOGIC ---
        function init() {
            populateFilters();
            applyFilters();
        }

        function populateFilters() {
            const areas = ["All", ...new Set(venues.map(v => v.area))].sort();
            const cats = ["All", ...new Set(venues.map(v => v.category))].sort();
            document.getElementById('filter-area').innerHTML = areas.map(a => `<option value="${a}">${a}</option>`).join('');
            document.getElementById('filter-cat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function applyFilters() {
            const search = document.getElementById('search-box').value.toLowerCase();
            const area = document.getElementById('filter-area').value;
            const cat = document.getElementById('filter-cat').value;

            const filtered = venues.filter(v => {
                if(area !== 'All' && v.area !== area) return false;
                if(cat !== 'All' && v.category !== cat) return false;
                if(search && !v.name.toLowerCase().includes(search) && !v.desc.toLowerCase().includes(search)) return false;
                return true;
            });

            renderList(filtered);
        }

        function renderList(list) {
            const container = document.getElementById('grid-container');
            document.getElementById('res-count').innerText = list.length;
            
            if(list.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">No results found matching your filters.</div>`;
                return;
            }

            container.innerHTML = list.map(v => `
                <div onclick="openModal(${v.id})" class="bg-white p-5 rounded-2xl shadow-sm card-shadow flex flex-col cursor-pointer group h-full">
                    <div class="flex-grow">
                        <span class="text-[9px] font-bold uppercase px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600 border border-indigo-100">${v.category}</span>
                        <h3 class="font-bold text-sm text-slate-900 mt-3 group-hover:text-indigo-600 transition leading-tight">${v.name}</h3>
                        <p class="text-[10px] text-slate-400 mt-1 flex items-center">📍 ${v.area}</p>
                        <p class="text-[11px] text-slate-600 mt-3 line-clamp-2 leading-relaxed">${v.desc}</p>
                    </div>
                    <div class="pt-4 mt-4 border-t border-slate-50 flex justify-between items-center text-[10px] font-bold text-slate-400 uppercase">
                        <span>${v.price} Price</span>
                        <span class="text-indigo-600 font-bold group-hover:translate-x-1 transition-transform">Profile →</span>
                    </div>
                </div>
            `).join('');
        }

        function openModal(id) {
            const v = venues.find(item => item.id === id);
            document.getElementById('modal-content').innerHTML = `
                <span class="text-[10px] font-bold uppercase text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full border border-indigo-100 inline-block mb-3">${v.category}</span>
                <h2 class="text-3xl font-bold text-slate-900 leading-tight">${v.name}</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 pt-6">
                    <div class="space-y-5">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Location Detail</h4>
                        <p class="text-sm text-slate-700 font-medium leading-relaxed">${v.address}</p>
                        <a href="${v.maps}" target="_blank" class="text-indigo-600 font-bold text-sm underline flex items-center italic">Open in Google Maps ↗</a>
                    </div>
                    <div class="space-y-5">
                        <h4 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Contact Information</h4>
                        <div class="space-y-2">
                            <p class="text-sm text-slate-700 font-medium">📞 ${v.phone}</p>
                            <p class="text-sm text-indigo-600 font-bold underline">Instagram: ${v.instagram}</p>
                        </div>
                    </div>
                </div>
                <div class="bg-slate-50 p-6 rounded-2xl border border-slate-100 mt-6">
                    <h4 class="text-[10px] font-bold text-slate-400 uppercase mb-2">Research Note</h4>
                    <p class="text-sm text-slate-600 leading-relaxed">${v.desc}</p>
                    <div class="flex mt-4 space-x-4">
                        <div class="text-[10px] font-bold"><span class="text-slate-400">AGE FIT:</span> ${v.age} YRS</div>
                        <div class="text-[10px] font-bold"><span class="text-slate-400">PRICE:</span> ${v.price}</div>
                    </div>
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() { 
            document.getElementById('detail-modal').classList.add('hidden'); 
            document.body.style.overflow = 'auto';
        }

        function exportCSV() {
            const headers = "ID,Name,Category,Area,Price,Age,Address,Instagram,Maps\n";
            const rows = venues.map(v => [v.id, `"${v.name}"`, v.category, v.area, v.price, v.age, `"${v.address}"`, v.instagram, v.maps].join(",")).join("\n");
            const blob = new Blob([headers + rows], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('hidden', '');
            a.setAttribute('href', url);
            a.setAttribute('download', 'BKK_Kids_Database_Export.csv');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        init();
    </script>
